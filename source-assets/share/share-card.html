<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card source</title>
<!--
  Source for public/assets/img/share-card.jpg, the link-preview image (og:image).
  Render at exactly 1200×630 (device scale 1) from the project root, e.g.
  http://127.0.0.1:4174/source-assets/share/share-card.html, screenshot it,
  then save as JPEG ≤ 120 KB. Mirrors the top of the program page.
-->
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(../../public/assets/fonts/poppins-400.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:700;src:url(../../public/assets/fonts/poppins-700.woff2) format("woff2")}
@font-face{font-family:Allura;font-weight:400;src:url(../../public/assets/fonts/allura-400.woff2) format("woff2")}
html,body{margin:0;background:#0a1230}
.card{width:1200px;height:630px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f5f2ea;font-family:Poppins,sans-serif;
  background:radial-gradient(1000px 460px at 50% -80px,rgba(70,96,190,.45),rgba(70,96,190,0) 70%) no-repeat,linear-gradient(180deg,#101b48 0,#0a1230 65%,#060b20 100%)}
.logo{display:block;width:330px;height:auto;margin:0 0 30px}
h1{position:relative;margin:0;padding:0 64px;font-weight:700;text-transform:uppercase;font-size:92px;line-height:.95;letter-spacing:-.01em}
.year{display:block;color:#ecc062;font-size:.56em;letter-spacing:.06em;margin-bottom:.14em}
.script{display:block;font-family:Allura,cursive;font-weight:400;text-transform:none;color:#ecc062;font-size:1.42em;line-height:.9;letter-spacing:0}
.sparkle{position:absolute;fill:#ecc062}
.sparkle.a{width:34px;right:10px;top:6px}
.sparkle.b{width:44px;left:4px;bottom:40px}
.when{margin:26px 0 0;padding-top:20px;border-top:1px solid rgba(236,192,98,.45);min-width:560px}
.date{margin:0;color:#ecc062;font-weight:700;font-size:25px;letter-spacing:.08em;text-transform:uppercase}
.place{margin:6px 0 0;font-weight:700;font-size:28px}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="../../public/assets/img/logo-light.svg" width="304" height="61" alt="">
  <h1>
    <svg class="sparkle a" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.8 7.2 4.8 11.2 12 12-7.2.8-11.2 4.8-12 12-.8-7.2-4.8-11.2-12-12 7.2-.8 11.2-4.8 12-12z"/></svg>
    <svg class="sparkle b" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.8 7.2 4.8 11.2 12 12-7.2.8-11.2 4.8-12 12-.8-7.2-4.8-11.2-12-12 7.2-.8 11.2-4.8 12-12z"/></svg>
    <span class="year">2026</span>Annual Awards<span class="script">Banquet</span>
  </h1>
  <div class="when">
    <p class="date">Sunday, September 27 · 11 AM – 2 PM</p>
    <p class="place">Blackhawk Country Club</p>
  </div>
</div>
</body>
</html>
